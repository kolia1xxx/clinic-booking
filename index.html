<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#1f5eff">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Запись онлайн: стоматология и клининг</title>
<style>
:root{--bg:#f2f6f5;--card:#fff;--ink:#12302d;--mute:#5d7471;--line:#d3dedc;--accent:#1f5eff;--accent-ink:#fff;--ok:#157a4a;--busy:#e6ecea;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a19;--card:#152624;--ink:#e6f1ef;--mute:#93aca8;--line:#27403c;--accent:#6c97ff;--accent-ink:#0b1220;--ok:#5fd49a;--busy:#1d312e}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
h2{scroll-margin-top:12px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.9rem;line-height:1.15;margin:8px 0 4px;letter-spacing:-.02em}
h2{font-size:1.05rem;margin:28px 0 10px}
.sub{color:var(--mute);margin:0 0 20px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;color:inherit;cursor:pointer;min-height:44px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.tab{padding:14px;border:2px solid var(--line);background:var(--card);border-radius:10px;font-weight:600}
.tab[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.list{display:grid;gap:8px}
.svc{min-height:56px;align-items:center;display:flex;justify-content:space-between;gap:12px;text-align:left;padding:12px 14px;border:1px solid var(--line);background:var(--card);border-radius:10px}
.svc[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.svc small{display:block;color:var(--mute)}
.price{white-space:nowrap;font-weight:600}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;min-width:68px;min-height:64px;scroll-snap-align:start;padding:10px 6px;border:1px solid var(--line);background:var(--card);border-radius:10px;text-align:center}
.day small{display:block;color:var(--mute)}
.day[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.day[aria-pressed=true] small{color:inherit}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.slot{padding:12px 0;min-height:48px;border:1px solid var(--line);background:var(--card);border-radius:8px}
.slot[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.slot:disabled{background:var(--busy);color:var(--mute);text-decoration:line-through;cursor:not-allowed}
form{display:grid;gap:12px}
label{display:grid;gap:4px;font-weight:600;font-size:.92rem}
input,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;width:100%;min-height:48px;font-size:16px}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.err{color:#c0392b;font-size:.88rem;min-height:1.2em}
@media(prefers-color-scheme:dark){.err{color:#ff8a7a}}
.summary{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.cta{width:100%;padding:14px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.cta:disabled{opacity:.5;cursor:not-allowed}
.done{border:2px solid var(--ok);border-radius:10px;padding:14px;background:var(--card)}
.done b{color:var(--ok)}
.mine{display:grid;gap:8px}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);background:var(--card);border-radius:10px}
.item small{color:var(--mute);display:block}
.link{background:none;border:0;color:var(--accent);text-decoration:underline;padding:4px}
[hidden]{display:none!important}
@media(max-width:600px){
 main{padding:16px 14px 24px}
 h1{font-size:1.6rem}
 .slots{grid-template-columns:repeat(3,1fr)}
 .bar{position:sticky;bottom:0;margin:0 -14px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:grid;gap:8px;z-index:5}
 .bar .summary{padding:8px 12px;font-size:.92rem}
}
@media(prefers-reduced-motion:no-preference){.done{animation:pop .25s ease-out}@keyframes pop{from{transform:scale(.97);opacity:0}}}
</style>
</head>
<body>
<main>
  <h1>Онлайн-запись</h1>
  <p class="sub">Выберите направление, услугу и удобное время. Подтверждение придёт после отправки заявки.</p>

  <div class="tabs" role="group" aria-label="Направление" id="tabs"></div>

  <h2>Услуга</h2>
  <div class="list" id="services"></div>

  <div id="cleanOpts" hidden>
    <h2>Площадь помещения</h2>
    <label>Площадь, м²
      <input id="area" type="number" min="10" max="500" value="50" inputmode="numeric">
    </label>
  </div>

  <h2 id="hDate">Дата</h2>
  <div class="days" id="days"></div>

  <h2 id="hTime">Время</h2>
  <div class="slots" id="slots"></div>

  <h2 id="hForm">Ваши данные</h2>
  <form id="form" novalidate>
    <label>Имя <input id="name" autocomplete="name" required><span class="err" id="eName"></span></label>
    <label>Телефон <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+380 50 123 45 67" required><span class="err" id="ePhone"></span></label>
    <label id="addrWrap" hidden>Адрес <input id="address" autocomplete="street-address"><span class="err" id="eAddr"></span></label>
    <label>Комментарий <textarea id="note" rows="2"></textarea></label>
    <div class="bar">
      <div class="summary" id="summary" aria-live="polite"></div>
      <button class="cta" id="submit" type="submit">Записаться</button>
    </div>
    <div class="err" id="eForm" role="alert"></div>
  </form>

  <div id="result" hidden></div>

  <h2 id="mineTitle" hidden>Мои записи</h2>
  <div class="mine" id="mine"></div>
</main>

<script>
/* ============ НАСТРОЙКИ: меняйте под себя ============ */
const CONFIG = {
  // Адрес вашего сервера, который примет заявку. Пока null — заявки только сохраняются в браузере.
  // Позже: "https://ваш-сервер.example/api/bookings"
  apiUrl: "http://localhost:3000/api/bookings",
  workHours: { from: 9, to: 18, stepMin: 60 },   // слоты с 9:00 до 18:00 каждые 60 минут
  daysAhead: 14,
  skipSundays: true,
  currency: "грн"
};

const CATEGORIES = {
  dental: {
    title: "Стоматология",
    needsAddress: false,
    services: [
      { id: "consult", name: "Консультация", note: "30 минут", price: 400 },
      { id: "clean",   name: "Профессиональная чистка", note: "60 минут", price: 1500 },
      { id: "filling", name: "Лечение кариеса", note: "60 минут", price: 1800 },
      { id: "whiten",  name: "Отбеливание", note: "90 минут", price: 3500 }
    ]
  },
  cleaning: {
    title: "Клининг",
    needsAddress: true,
    services: [
      { id: "regular", name: "Поддерживающая уборка", note: "цена за м²", perM2: 25 },
      { id: "general", name: "Генеральная уборка", note: "цена за м²", perM2: 45 },
      { id: "windows", name: "Мытьё окон", note: "цена за м²", perM2: 15 }
    ]
  }
};

/* ============ ИНТЕГРАЦИИ: сюда подключаются внешние сервисы ============ */
/* Вся логика отправки заявки находится в этой одной функции.
   Секретные ключи (Telegram, Google, SMS) НЕЛЬЗЯ хранить в этом файле:
   их держат на сервере, а сайт шлёт заявку на ваш apiUrl. */
async function sendBooking(booking) {
  if (!CONFIG.apiUrl) {
    await new Promise(r => setTimeout(r, 400)); // имитация ответа сервера
    return { ok: true, id: "local-" + Date.now() };
  }
  const res = await fetch(CONFIG.apiUrl, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(booking)
  });
  if (!res.ok) throw new Error("Сервер ответил ошибкой " + res.status);
  return await res.json(); // сервер вернёт { ok: true, id: "..." }
}

/* ============ СОСТОЯНИЕ ============ */
const $ = id => document.getElementById(id);
const state = { cat: "dental", service: null, date: null, time: null };
let bookings = [];
try { bookings = JSON.parse(localStorage.getItem("bookings") || "[]"); } catch (e) { bookings = []; }
const saveLocal = () => { try { localStorage.setItem("bookings", JSON.stringify(bookings)); } catch (e) {} };

const iso = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const fmtDate = s => new Date(s + "T00:00").toLocaleDateString("ru-RU", { weekday: "long", day: "numeric", month: "long" });
const cur = CONFIG.currency;

function priceOf(svc) {
  if (svc.price) return svc.price;
  const a = Math.max(10, +$("area").value || 0);
  return svc.perM2 * a;
}

/* Занятые слоты: пока имитация. Позже их будет отдавать сервер/календарь. */
function isBusy(date, time) {
  if (bookings.some(b => b.cat === state.cat && b.date === date && b.time === time)) return true;
  let h = 0; const s = state.cat + date + time;
  for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return h % 4 === 0;
}

/* На телефоне после выбора сама прокручивает к следующему шагу */
const goTo = el => {
  if (!matchMedia("(max-width:600px)").matches) return;
  const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  setTimeout(() => el.scrollIntoView({ behavior: calm ? "auto" : "smooth", block: "start" }), 80);
};

/* ============ ОТРИСОВКА ============ */
function renderTabs() {
  $("tabs").innerHTML = "";
  for (const [key, c] of Object.entries(CATEGORIES)) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "tab"; b.textContent = c.title;
    b.setAttribute("aria-pressed", key === state.cat);
    b.onclick = () => { state.cat = key; state.service = null; state.time = null; renderAll(); };
    $("tabs").append(b);
  }
}
function renderServices() {
  const c = CATEGORIES[state.cat];
  $("services").innerHTML = "";
  c.services.forEach(s => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "svc";
    b.setAttribute("aria-pressed", state.service === s.id);
    const p = s.price ? s.price + " " + cur : "от " + (s.perM2 * 10) + " " + cur;
    b.innerHTML = '<span>' + s.name + '<small>' + s.note + '</small></span><span class="price">' + p + '</span>';
    b.onclick = () => { state.service = s.id; renderServices(); renderSummary(); goTo($("hDate")); };
    $("services").append(b);
  });
  $("cleanOpts").hidden = !c.needsAddress;
  $("addrWrap").hidden = !c.needsAddress;
}
function renderDays() {
  $("days").innerHTML = "";
  let d = new Date(), n = 0, first = null;
  while (n < CONFIG.daysAhead) {
    if (!(CONFIG.skipSundays && d.getDay() === 0)) {
      const s = iso(d); first = first || s;
      const b = document.createElement("button");
      b.type = "button"; b.className = "day";
      b.setAttribute("aria-pressed", state.date === s);
      b.innerHTML = d.toLocaleDateString("ru-RU", { day: "numeric", month: "short" }) + '<small>' + d.toLocaleDateString("ru-RU", { weekday: "short" }) + '</small>';
      b.onclick = () => { state.date = s; state.time = null; renderDays(); renderSlots(); renderSummary(); goTo($("hTime")); };
      $("days").append(b); n++;
    }
    d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
  }
  if (!state.date) { state.date = first; renderDays(); }
}
function renderSlots() {
  $("slots").innerHTML = "";
  const { from, to, stepMin } = CONFIG.workHours;
  const now = new Date();
  for (let m = from * 60; m < to * 60; m += stepMin) {
    const t = String(Math.floor(m/60)).padStart(2,"0") + ":" + String(m%60).padStart(2,"0");
    const past = state.date === iso(now) && m <= now.getHours() * 60 + now.getMinutes();
    const b = document.createElement("button");
    b.type = "button"; b.className = "slot"; b.textContent = t;
    b.disabled = past || isBusy(state.date, t);
    b.setAttribute("aria-pressed", state.time === t);
    b.onclick = () => { state.time = t; renderSlots(); renderSummary(); goTo($("hForm")); };
    $("slots").append(b);
  }
}
function renderSummary() {
  const c = CATEGORIES[state.cat];
  const s = c.services.find(x => x.id === state.service);
  $("summary").innerHTML = s && state.time
    ? "<b>" + s.name + "</b><br>" + fmtDate(state.date) + ", " + state.time + "<br>Стоимость: <b>" + priceOf(s) + " " + cur + "</b>"
    : "Выберите услугу, дату и время.";
}
function renderMine() {
  $("mineTitle").hidden = !bookings.length;
  $("mine").innerHTML = "";
  bookings.forEach(b => {
    const el = document.createElement("div"); el.className = "item";
    el.innerHTML = "<span>" + b.serviceName + "<small>" + fmtDate(b.date) + ", " + b.time + " · " + CATEGORIES[b.cat].title + "</small></span>";
    const x = document.createElement("button"); x.className = "link"; x.type = "button"; x.textContent = "Отменить";
    x.onclick = () => { bookings = bookings.filter(i => i.id !== b.id); saveLocal(); renderMine(); renderSlots(); };
    el.append(x); $("mine").append(el);
  });
}
function renderAll() { renderTabs(); renderServices(); renderSlots(); renderSummary(); $("result").hidden = true; }

/* ============ ОТПРАВКА ФОРМЫ ============ */
$("area").addEventListener("input", renderSummary);
$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const c = CATEGORIES[state.cat];
  const svc = c.services.find(x => x.id === state.service);
  ["eName","ePhone","eAddr","eForm"].forEach(i => $(i).textContent = "");
  let ok = true;
  if (!$("name").value.trim()) { $("eName").textContent = "Укажите имя"; ok = false; }
  if ($("phone").value.replace(/\D/g, "").length < 10) { $("ePhone").textContent = "Введите телефон полностью"; ok = false; }
  if (c.needsAddress && !$("address").value.trim()) { $("eAddr").textContent = "Укажите адрес"; ok = false; }
  if (!svc || !state.time) { $("eForm").textContent = "Выберите услугу и время"; ok = false; }
  if (!ok) return;

  const booking = {
    id: "b" + Date.now(),
    cat: state.cat, serviceId: svc.id, serviceName: svc.name,
    date: state.date, time: state.time, price: priceOf(svc),
    name: $("name").value.trim(), phone: $("phone").value.trim(),
    address: c.needsAddress ? $("address").value.trim() : "",
    area: c.needsAddress ? +$("area").value : null,
    note: $("note").value.trim(), createdAt: new Date().toISOString()
  };
  $("submit").disabled = true; $("submit").textContent = "Отправляем…";
  try {
    const r = await sendBooking(booking);
    if (!r.ok) throw new Error("Заявка не принята");
    bookings.push(booking); saveLocal();
    $("result").hidden = false;
    $("result").innerHTML = '<div class="done"><b>Заявка отправлена.</b><br>' + svc.name + ", " + fmtDate(booking.date) + ", " + booking.time + ".<br>Мы свяжемся с вами по номеру " + booking.phone + ".</div>";
    state.time = null; $("note").value = "";
    renderSlots(); renderSummary(); renderMine();
    $("result").scrollIntoView({ behavior: "smooth", block: "center" });
  } catch (err) {
    $("eForm").textContent = "Не удалось отправить заявку: " + err.message + ". Попробуйте ещё раз.";
  } finally {
    $("submit").disabled = false; $("submit").textContent = "Записаться";
  }
});

renderAll(); renderDays(); renderSlots(); renderMine();
</script>
</body>
</html>
